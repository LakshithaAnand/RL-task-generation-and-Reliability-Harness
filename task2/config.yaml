# Task 2 configuration. All model names are configurable; exact model IDs are
# logged in every attempt and grade record for reproducibility.

paths:
  tasks_dir: tasks_real
  fixtures_dir: fixtures/adversarial
  attempts_dir: data/attempts
  grades_dir: data/grades
  reports_dir: data/reports

# Model names are configurable; exact IDs are logged in every attempt/grade record.
# Cheap/imperfect model for attempt generation (we WANT a pass/partial/fail mix).
agent_model: claude-haiku-4-5-20251001
# Stronger model for grading (judge in single-pass and multi-hop modes).
grader_model: claude-opus-4-8
# Worker model for multi-hop evidence extraction (stage 1; judge stays grader_model).
extractor_model: claude-haiku-4-5-20251001

agent:
  model: claude-haiku-4-5-20251001

  # Defaults used unless an attempt variant overrides them.
  max_steps: 20
  max_tokens_per_call: 2048
  temperature: 0.7

  # Used by `task2 collect` to create a pass/fail/partial mix.
  attempt_variants:
    - name: low_budget_deterministic
      temperature: 0.0
      max_steps: 6
      max_tokens_per_call: 1024

    - name: medium_budget_balanced
      temperature: 0.3
      max_steps: 12
      max_tokens_per_call: 2048

    - name: high_budget_exploratory
      temperature: 0.7
      max_steps: 20
      max_tokens_per_call: 2048

  command_timeout_sec: 120
  attempt_timeout_sec: 1800
  max_output_chars: 8000

docker:
  build_timeout_sec: 3600
  cpus: 2
  memory: 4g

grader:
  # claude-opus-4-8 deprecates the temperature param; null = omit it.
  # Set a float (e.g. 0.0) only for grader models that still support it.
  temperature: null
  # (one corrective retry on malformed JSON is fixed behavior per spec,
  #  implemented in grader._finalize — not configurable)
  use_batch_api: true        # Batch API for grading calls
  batch_timeout_sec: 14400   # batches can take hours under load; poll patiently
  prompt_caching: true       # cache shared task/trajectory/rubric blocks
  # Trajectories longer than this (chars) are gated to multi-hop grading.
  multi_hop_length_gate_chars: 40000

seed: 42
